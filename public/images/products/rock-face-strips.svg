<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="rock face strips — illustrative stone texture">
  <title>rock face strips — illustrative stone texture</title>
  <defs>
    <filter id="mott-dark" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="1207" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.604  0 0 0 0 0.494  0 0 0 0 0.361  1.7 0 0 0 -0.55"/>
