<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="tiger skin — illustrative stone texture">
  <title>tiger skin — illustrative stone texture</title>
  <defs>
    <filter id="mott-dark" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="1123" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.494  0 0 0 0 0.337  0 0 0 0 0.173  1.7 0 0 0 -0.55"/>
    </filter>
    <filter id="mott-light" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="1124" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.776  0 0 0 0 0.576  0 0 0 0 0.337  1.5 0 0 0 -0.55"/>
    </filter>
    <filter id="spec-a" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.75" numOctaves="2" seed="1124" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.949
                0 0 0 0 0.937
                0 0 0 0 0.914
                2.1 0 0 0 -0.42"/>
    </filter>
