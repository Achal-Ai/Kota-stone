<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="kota blue — illustrative stone texture">
  <title>kota blue — illustrative stone texture</title>
  <defs>
    <filter id="mott-dark" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="1004" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.373  0 0 0 0 0.424  0 0 0 0 0.431  1.7 0 0 0 -0.55"/>
    </filter>
    <filter id="mott-light" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="1005" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.576  0 0 0 0 0.627  0 0 0 0 0.631  1.5 0 0 0 -0.55"/>
    </filter>
    <filter id="fleck" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="1.1" numOctaves="2" seed="1007" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.373
                0 0 0 0 0.424
                0 0 0 0 0.431
                1.2 0 0 0 -0.42"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="4" seed="1013" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="60"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="1021" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.000  0 0 0 0 0.000  0 0 0 0 0.000  1.1 0 0 0 -0.55"/>
    </filter><radialGradient id="vig" cx="50%" cy="42%" r="78%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.22"/></radialGradient></defs>
<rect width="800" height="1000" fill="#7C8A8C"/><rect width="800" height="1000" filter="url(#mott-dark)" opacity="0.55"/><rect width="800" height="1000" filter="url(#mott-light)" opacity="0.42"/><rect width="800" height="1000" filter="url(#fleck)" opacity="0.28"/><g filter="url(#warp)" opacity="0.3"><rect y="420" width="800" height="160" fill="#5F6C6E"/><rect y="680" width="800" height="90" fill="#93A0A1"/><rect y="120" width="800" height="70" fill="#93A0A1"/></g><rect width="800" height="1000" filter="url(#grain)" opacity="0.16"/><rect width="800" height="1000" fill="url(#vig)"/>
</svg>
