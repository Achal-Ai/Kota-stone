<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="applications staircase">
  <title>applications staircase</title>
  <defs>
    <filter id="mott-dark" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="2160" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.078  0 0 0 0 0.075  0 0 0 0 0.071  1.7 0 0 0 -0.55"/>
    </filter>
    <filter id="mott-light" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="2161" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.227  0 0 0 0 0.224  0 0 0 0 0.216  1.5 0 0 0 -0.55"/>
    </filter>
    <filter id="fleck" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="1.1" numOctaves="2" seed="2163" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.078
                0 0 0 0 0.075
                0 0 0 0 0.071
                1.2 0 0 0 -0.42"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="4" seed="2169" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="60"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="2177" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.000  0 0 0 0 0.000  0 0 0 0 0.000  1.1 0 0 0 -0.55"/>
    </filter><radialGradient id="vig" cx="50%" cy="42%" r="78%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.22"/></radialGradient>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A99A88"/>
      <stop offset="100%" stop-color="#242321"/>
    </linearGradient>
    <radialGradient id="vigI" cx="50%" cy="45%" r="80%">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="stone" width="900" height="600" patternUnits="userSpaceOnUse"><rect width="900" height="600" fill="#232220"/><rect width="900" height="600" filter="url(#mott-dark)" opacity="0.55"/><rect width="900" height="600" filter="url(#mott-light)" opacity="0.42"/><rect width="900" height="600" filter="url(#fleck)" opacity="0.28"/><g filter="url(#warp)" opacity="0.3"><rect y="252" width="900" height="96" fill="#141312"/><rect y="408" width="900" height="54" fill="#3A3937"/><rect y="72" width="900" height="42" fill="#3A3937"/></g><rect width="900" height="600" filter="url(#grain)" opacity="0.16"/><rect width="900" height="600" fill="url(#vig)"/></pattern></defs>
