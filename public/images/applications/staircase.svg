y1="810" x2="1944" y2="1500"/><line x1="600.0" y1="810" x2="2112" y2="1500"/><line x1="600.0" y1="810" x2="2280" y2="1500"/><line x1="0" y1="823" x2="1200" y2="823"/><line x1="0" y1="860" x2="1200" y2="860"/><line x1="0" y1="917" x2="1200" y2="917"/><line x1="0" y1="995" x2="1200" y2="995"/><line x1="0" y1="1093" x2="1200" y2="1093"/><line x1="0" y1="1209" x2="1200" y2="1209"/><line x1="0" y1="1345" x2="1200" y2="1345"/></g><polygon points="0,810 1200,810 1200,1500 0,1500" fill="url(#stone)" opacity="0.35"/><g transform="translate(130 218)"><rect width="158" height="592" fill="url(#stone)"/><rect width="158" height="592" fill="#000" opacity="0.14"/><rect x="154" width="4" height="592" fill="#9A6B43"/><rect y="588" width="158" height="4" fill="#9A6B43" opacity="0.6"/></g><polygon points="130,810 288,810 336,1045 83,1045" fill="#000" opacity="0.26"/><polygon points="146,1045 273,1045 288,1238 130,1238" fill="#000" opacity="0.22"/><g transform="translate(522 119)"><rect width="164" height="691" fill="url(#stone)"/><rect width="164" height="691" fill="#000" opacity="0.14"/><rect x="160" width="4" height="691" fill="#9A6B43"/><rect y="687" width="164" height="4" fill="#9A6B43" opacity="0.6"/></g><polygon points="522,810 686,810 735,1045 473,1045" fill="#000" opacity="0.26"/><polygon points="538,1045 670,1045 686,1238 522,1238" fill="#000" opacity="0.22"/><g transform="translate(864 320)"><rect width="134" height="490" fill="url(#stone)"/><rect width="134" height="490" fill="#000" opacity="0.14"/><rect x="130" width="4" height="490" fill="#9A6B43"/><rect y="486" width="134" height="4" fill="#9A6B43" opacity="0.6"/></g><polygon points="864,810 997,810 1037,1045 823,1045" fill="#000" opacity="0.26"/><polygon points="877,1045 984,1045 997,1238 864,1238" fill="#000" opacity="0.22"/><rect x="432" y="990" width="312" height="150" fill="url(#stone)" stroke="#9A6B43" stroke-width="2"/><polygon points="72,0 360,0 672,1500 288,1500" fill="#D8C6A5" opacity="0.3" filter="url(#haze)"/