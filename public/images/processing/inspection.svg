<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="processing inspection">
  <title>processing inspection</title>
  <defs>
    <radialGradient id="vig3" cx="50%" cy="45%" r="80%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.18"/>
    </radialGradient></defs>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EFE8DC"/><stop offset="100%" stop-color="#DCD1BE"/></linearGradient><pattern id="stone" width="700" height="500" patternUnits="userSpaceOnUse"><rect width="700" height="500" fill="#7C8B76"/><rect width="700" height="500" filter="url(#mott-dark)" opacity="0.55"/><rect width="700" height="500" filter="url(#mott-light)" opacity="0.42"/><rect width="700" height="500" filter="url(#fleck)" opacity="0.28"/><g filter="url(#warp)" opacity="0.3"><rect y="210" width="700" height="80" fill="#5F6E5A"/><rect y="340" width="700" height="45" fill="#94A38C"/><rect y="60" width="700" height="35" fill="#94A38C"/></g><rect width="700" height="500" filter="url(#grain)" opacity="0.16"/><rect width="700" height="500" fill="url(#vig)"/></pattern>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter></defs>
    <filter id="mott-dark" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="2212" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.373  0 0 0 0 0.431  0 0 0 0 0.353  1.7 0 0 0 -0.55"/>
    </filter>
    <filter id="mott-light" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="2213" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.580  0 0 0 0 0.639  0 0 0 0 0.549  1.5 0 0 0 -0.55"/>
    </filter>
    <filter id="fleck" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="1.1" numOctaves="2" seed="2215" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.373
                0 0 0 0 0.431
                0 0 0 0 0.353
                1.2 0 0 0 -0.42"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="4" seed="2221" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="60"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="2229" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.000  0 0 0 0 0.000  0 0 0 0 0.000  1.1 0 0 0 -0.55"/>
    </filter><radialGradient id="vig" cx="50%" cy="42%" r="78%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.22"/></radialGradient><rect width="1600" height="660" fill="url(#sky)"/><rect y="660" width="1600" height="340" fill="#A99A88" opacity="0.55"/><line x1="0" y1="660" x2="1600" y2="660" stroke="#242321" stroke-opacity="0.25" stroke-width="2"/><g transform="translate(64 660) rotate(-6.9)"><rect x="0" y="-501" width="138" height="501" fill="url(#stone)"/><rect x="134" y="-501" width="4" height="501" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-501" width="138" height="501" fill="#242321" opacity="0.07"/></g><g transform="translate(280 660) rotate(-6.4)"><rect x="0" y="-512" width="164" height="512" fill="url(#stone)"/><rect x="160" y="-512" width="4" height="512" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-512" width="164" height="512" fill="#242321" opacity="0.07"/></g><g transform="translate(496 660) rotate(-4.1)"><rect x="0" y="-511" width="183" height="511" fill="url(#stone)"/><rect x="179" y="-511" width="4" height="511" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-511" width="183" height="511" fill="#242321" opacity="0.07"/></g><g transform="translate(712 660) rotate(-6.9)"><rect x="0" y="-500" width="137" height="500" fill="url(#stone)"/><rect x="133" y="-500" width="4" height="500" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-500" width="137" height="500" fill="#242321" opacity="0.07"/></g><g transform="translate(928 660) rotate(-4.0)"><rect x="0" y="-444" width="154" height="444" fill="url(#stone)"/><rect x="150" y="-444" width="4" height="444" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-444" width="154" height="444" fill="#242321" opacity="0.07"/></g><g transform="translate(1144 660) rotate(-3.1)"><rect x="0" y="-348" width="165" height="348" fill="url(#stone)"/><rect x="161" y="-348" width="4" height="348" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-348" width="165" height="348" fill="#242321" opacity="0.07"/></g><g transform="translate(1360 660) rotate(-4.4)"><rect x="0" y="-501" width="175" height="501" fill="url(#stone)"/><rect x="171" y="-501" width="4" height="501" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-501" width="175" height="501" fill="#242321" opacity="0.07"/></g><polygon points="320,0 880,0 640,1000 80,1000" fill="#D8C6A5" opacity="0.2" filter="url(#haze)"/><rect width="1600" height="1000" fill="url(#vig3)"/>
</svg>
