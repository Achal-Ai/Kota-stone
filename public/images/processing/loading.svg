<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="processing loading">
  <title>processing loading</title>
  <defs>
    <radialGradient id="vig3" cx="50%" cy="45%" r="80%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.18"/>
    </radialGradient></defs>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EFE8DC"/><stop offset="100%" stop-color="#DCD1BE"/></linearGradient><pattern id="stone" width="700" height="500" patternUnits="userSpaceOnUse"><rect width="700" height="500" fill="#4C4B48"/><rect width="700" height="500" filter="url(#mott-dark)" opacity="0.55"/><rect width="700" height="500" filter="url(#mott-light)" opacity="0.42"/><rect width="700" height="500" filter="url(#fleck)" opacity="0.28"/><g filter="url(#warp)" opacity="0.3"><rect y="210" width="700" height="80" fill="#35342F"/><rect y="340" width="700" height="45" fill="#63625E"/><rect y="60" width="700" height="35" fill="#63625E"/></g><rect width="700" height="500" filter="url(#grain)" opacity="0.16"/><rect width="700" height="500" fill="url(#vig)"/></pattern>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter></defs>
    <filter id="mott-dark" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="2199" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.208  0 0 0 0 0.204  0 0 0 0 0.184  1.7 0 0 0 -0.55"/>
    </filter>
    <filter id="mott-light" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="2200" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.388  0 0 0 0 0.384  0 0 0 0 0.369  1.5 0 0 0 -0.55"/>
    </filter>
    <filter id="fleck" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="1.1" numOctaves="2" seed="2202" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.208
                0 0 0 0 0.204
                0 0 0 0 0.184
                1.2 0 0 0 -0.42"/>
    </filter>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="4" seed="2208" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="60"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="2216" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.000  0 0 0 0 0.000  0 0 0 0 0.000  1.1 0 0 0 -0.55"/>
    </filter><radialGradient id="vig" cx="50%" cy="42%" r="78%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.22"/></radialGradient><rect width="1600" height="660" fill="url(#sky)"/><rect y="660" width="1600" height="340" fill="#A99A88" opacity="0.55"/><line x1="0" y1="660" x2="1600" y2="660" stroke="#242321" stroke-opacity="0.25" stroke-width="2"/><g transform="translate(64 660) rotate(-6.4)"><rect x="0" y="-351" width="182" height="351" fill="url(#stone)"/><rect x="178" y="-351" width="4" height="351" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-351" width="182" height="351" fill="#242321" opacity="0.07"/></g><g transform="translate(280 660) rotate(-4.2)"><rect x="0" y="-483" width="140" height="483" fill="url(#stone)"/><rect x="136" y="-483" width="4" height="483" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-483" width="140" height="483" fill="#242321" opacity="0.07"/></g><g transform="translate(496 660) rotate(-6.5)"><rect x="0" y="-381" width="152" height="381" fill="url(#stone)"/><rect x="148" y="-381" width="4" height="381" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-381" width="152" height="381" fill="#242321" opacity="0.07"/></g><g transform="translate(712 660) rotate(-5.2)"><rect x="0" y="-454" width="202" height="454" fill="url(#stone)"/><rect x="198" y="-454" width="4" height="454" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-454" width="202" height="454" fill="#242321" opacity="0.07"/></g><g transform="translate(928 660) rotate(-5.5)"><rect x="0" y="-353" width="129" height="353" fill="url(#stone)"/><rect x="125" y="-353" width="4" height="353" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-353" width="129" height="353" fill="#242321" opacity="0.07"/></g><g transform="translate(1144 660) rotate(-5.7)"><rect x="0" y="-467" width="193" height="467" fill="url(#stone)"/><rect x="189" y="-467" width="4" height="467" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-467" width="193" height="467" fill="#242321" opacity="0.07"/></g><g transform="translate(1360 660) rotate(-4.1)"><rect x="0" y="-508" width="185" height="508" fill="url(#stone)"/><rect x="181" y="-508" width="4" height="508" fill="#9A6B43" opacity="0.55"/><rect x="0" y="-508" width="185" height="508" fill="#242321" opacity="0.07"/></g><polygon points="320,0 880,0 640,1000 80,1000" fill="#D8C6A5" opacity="0.2" filter="url(#haze)"/><rect width="1600" height="1000" fill="url(#vig3)"/>
